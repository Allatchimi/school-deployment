name: School Development CI
run-name: ${{ github.actor }} is deploying School to Development
on:
  push:
    branches: [dev]
  workflow_dispatch:

jobs:
  deploy-school-k3s:
    runs-on: ubuntu-latest
    env:
      POSTGRES_ENV: ${{ secrets.POSTGRES_ENV_DEV }}
      REDIS_ENV: ${{ secrets.REDIS_ENV_DEV }}
      API_ENV: ${{ secrets.API_ENV_DEV }}
      API_JWT_PRIVATE_KEY: ${{ secrets.API_JWT_PRIVATE_KEY_DEV }}
      API_JWT_PUBLIC_KEY: ${{ secrets.API_JWT_PUBLIC_KEY_DEV }}
      NAMESPACE: "school-dev"
      REPOSITORY_NAME: ${{ github.event.repository.name }}
    environment:
      name: "Development"
      url: https://dev.digitcore.cm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7
        with:
          ref: ${{ github.ref_name }}

      - name: Install SSH keys
        run: |
          mkdir -p $HOME/.ssh
          chmod 700 $HOME/.ssh

          cat > $HOME/.ssh/temp_key << 'EOF'
          ${{ secrets.SSH_KEY }}
          EOF

          chmod 600 $HOME/.ssh/temp_key
          KEY_FILE="$HOME/.ssh/temp_key"

          ssh-keygen -lf $KEY_FILE || {
            echo "Invalid SSH key"
            exit 1
          }
            
          ssh-keyscan -H ${{ secrets.SSH_HOST }} >> $HOME/.ssh/known_hosts

          # Configure SSH to use the correct identity file for this host
          echo "Host ${{ secrets.SSH_HOST }}" > $HOME/.ssh/config
          echo "  User ${{ secrets.SSH_USER }}" >> $HOME/.ssh/config
          echo "  IdentityFile $KEY_FILE" >> $HOME/.ssh/config
          echo "  StrictHostKeyChecking yes" >> $HOME/.ssh/config
          chmod 600 $HOME/.ssh/config

      - name: Remove old project files from server
        continue-on-error: true
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          mkdir -p ${{ secrets.WORK_DIR_CI_DEV }} && \
          cd ${{ secrets.WORK_DIR_CI_DEV }} && \
          rm -rf ${{ env.REPOSITORY_NAME }}"

      - name: Copy the repository files to the server
        run: |
          scp -P 22 -r ../${{ env.REPOSITORY_NAME }} ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WORK_DIR_CI_DEV }}

      - name: Kubernetes - Create namespaces
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          cd ${{ secrets.WORK_DIR_CI_DEV }}/${{ env.REPOSITORY_NAME }} && \
          make k-create-namespaces || true"

      - name: Kubernetes - Apply letsencrypt certificates
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          cd ${{ secrets.WORK_DIR_CI_DEV }}/${{ env.REPOSITORY_NAME }} && \
          make k-apply-letsencrypt-admin  && \
          make k-apply-letsencrypt-api"

      - name: Kubernetes - Create PV and PVC
        continue-on-error: true
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          cd ${{ secrets.WORK_DIR_CI_DEV }}/${{ env.REPOSITORY_NAME }} && \
          make k-apply-volume-dev || true"

      - name: Kubernetes - Delete secrets
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          kubectl delete secret ghcr-secret --namespace ${{ env.NAMESPACE }} || true"

      - name: Kubernetes - Create secrets
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          kubectl create secret docker-registry ghcr-secret --namespace ${{ env.NAMESPACE }} \
          --docker-server=https://ghcr.io \
          --docker-username=${{secrets.GHCR_USERNAME}} \
          --docker-password=${{secrets.GHCR_PASSWORD}} \
          --docker-email=${{secrets.GHCR_EMAIL}}"

      - name: Kubernetes - Delete config map
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          kubectl delete configmap postgres-env-config --namespace ${{ env.NAMESPACE }} || echo 'postgres-env-config does not exist or failed to delete!' ; \
          kubectl delete configmap redis-env-config --namespace ${{ env.NAMESPACE }} || echo 'redis-env-config does not exist or failed to delete!' ; \
          kubectl delete configmap api-env-config --namespace ${{ env.NAMESPACE }} || echo 'api-env-config does not exist or failed to delete!' ; \
          kubectl delete configmap api-jwt-config --namespace ${{ env.NAMESPACE }} || echo 'api-jwt-config does not exist or failed to delete!'"

      - name: Kubernetes - Create config map
        run: |
          echo "$POSTGRES_ENV" > postgres.env
          echo "$REDIS_ENV" > redis.env
          echo "$API_ENV" > app.env
          echo "$API_JWT_PRIVATE_KEY" > private.pem
          echo "$API_JWT_PUBLIC_KEY" > public.pem

          scp -P 22 postgres.env redis.env app.env private.pem public.pem ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ secrets.WORK_DIR_CI_DEV }}/${{ env.REPOSITORY_NAME }}
          rm -f postgres.env redis.env app.env private.pem public.pem

          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          cd ${{ secrets.WORK_DIR_CI_DEV }}/${{ env.REPOSITORY_NAME }} && set -e && \
          kubectl create configmap postgres-env-config --from-env-file=postgres.env --namespace ${{ env.NAMESPACE }} && \
          kubectl create configmap redis-env-config --from-env-file=redis.env --namespace ${{ env.NAMESPACE }} && \
          kubectl create configmap api-env-config --from-file=app.env --namespace ${{ env.NAMESPACE }} && \
          kubectl create configmap api-jwt-config --from-file=private.pem --from-file=public.pem --namespace ${{ env.NAMESPACE }}"

      - name: Kubernetes - Apply deployments
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          cd ${{ secrets.WORK_DIR_CI_DEV }}/${{ env.REPOSITORY_NAME }} && \
          set -e && \
          make k-apply-deploy-redis-dev && \
          make k-apply-deploy-postgres-dev && \
          make k-apply-deploy-api-dev && \
          make k-apply-deploy-admin-dev"

      - name: Kubernetes - Apply services
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          cd ${{ secrets.WORK_DIR_CI_DEV }}/${{ env.REPOSITORY_NAME }} && \
          set -e && \
          kubectl apply -f ./kubernetes/services/redis.yml --namespace ${{ env.NAMESPACE }} && \
          kubectl apply -f ./kubernetes/services/postgres.yml --namespace ${{ env.NAMESPACE }} && \
          kubectl apply -f ./kubernetes/services/api.yml --namespace ${{ env.NAMESPACE }} && \
          kubectl apply -f ./kubernetes/services/admin.yml --namespace ${{ env.NAMESPACE }}"

      - name: Kubernetes - Apply middlewares
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          cd ${{ secrets.WORK_DIR_CI_DEV }}/${{ env.REPOSITORY_NAME }} && \
          set -e && \
          kubectl apply -f ./kubernetes/middlewares/sslredirect.yml"

      - name: Kubernetes - Apply ingress
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          cd ${{ secrets.WORK_DIR_CI_DEV }}/${{ env.REPOSITORY_NAME }} && \
          make k-apply-ingress-dev"

      - name: Wait for pods to be ready
        timeout-minutes: 5
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          echo '🔄 Waiting for School pods to be ready...' && \
          kubectl wait --for=condition=ready pod -l app=postgres --namespace ${{ env.NAMESPACE }} --timeout=300s && \
          kubectl wait --for=condition=ready pod -l app=redis --namespace ${{ env.NAMESPACE }} --timeout=300s && \
          kubectl wait --for=condition=ready pod -l app=api --namespace ${{ env.NAMESPACE }} --timeout=300s && \
          kubectl wait --for=condition=ready pod -l app=admin --namespace ${{ env.NAMESPACE }} --timeout=300s"

      - name: Verify deployment
        timeout-minutes: 2
        run: |
          ssh ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} "\
          echo '✅ Pods are ready! Checking services...' && \
          kubectl get services --namespace ${{ env.NAMESPACE }} && \
          kubectl get pods -l app=postgres --namespace ${{ env.NAMESPACE }} -o wide && \
          kubectl get pods -l app=redis --namespace ${{ env.NAMESPACE }} -o wide && \
          kubectl get pods -l app=api --namespace ${{ env.NAMESPACE }} -o wide && \
          kubectl get pods -l app=admin --namespace ${{ env.NAMESPACE }} -o wide && \
          echo '🎉 School deployment successful!'"

      - name: Cleanup SSH dir
        run: rm -rf $HOME/.ssh
