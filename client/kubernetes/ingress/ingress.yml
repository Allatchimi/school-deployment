# Http
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-school-client
  namespace: {{NAMESPACE}}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: kube-system-sslredirect@kubernetescrd
    cert-manager.io/cluster-issuer: {{LETSENCRYPT_CLUSTER_ISSUER}}
spec:
  ingressClassName: traefik
  rules:
    - host: {{DOMAIN_NAME}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 3000
  tls:
    - hosts:
        - {{DOMAIN_NAME}}
      secretName: school-client-tls-secret
