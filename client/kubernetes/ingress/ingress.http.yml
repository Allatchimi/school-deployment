apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-school-client
  namespace: {{NAMESPACE}}
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
spec:
  ingressClassName: traefik
  rules:
    - host: {{DOMAIN_NAME}}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: client
                port:
                  number: 3000
