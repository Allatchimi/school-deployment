apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: school-staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      volumes:
        - name: postgres-volume
          persistentVolumeClaim:
            claimName: postgres
      containers:
        - name: postgres
          image: "postgres:16"
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-env-config
          volumeMounts:
            - name: postgres-volume
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: "1"
              memory: "2Gi"
            requests:
              cpu: "500m"
              memory: "512Mi"
