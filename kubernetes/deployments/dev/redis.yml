apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: school-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      volumes:
      - name: redis-dev
        persistentVolumeClaim:
          claimName: redis-dev
      containers:
      - name: redis
        image: "ghcr.io/emenec-finance/school/redis:3"
        ports:
        - containerPort: 6379
        envFrom:
          - secretRef:
              name: app-secret
        volumeMounts:
        - name: redis-dev
          mountPath: /data
        resources:
          limits:
            cpu: "500m"
            memory: "512Mi"
          requests:
            cpu: "500m"
            memory: "512Mi"
        livenessProbe:
          exec:
            command:
            - ls
            - /data
          initialDelaySeconds: 5
          periodSeconds: 5
