apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: school-dev
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      imagePullSecrets:
        - name: ghcr-secret
      containers:
        - name: admin
          image: "ghcr.io/allatchimi/school-template/school-admin-dev:207"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: API_BASE_URL
              value: "http://api.school-dev:3100/api/v1"
            - name: CDN_URL
              value: "http://cdn.school-dev:3100/api/v1"
            - name: NEXT_AUTH_URL
              value: "https://dev.digitcore.cm"
            - name: NEXT_PUBLIC_WEBSITE_URL
              value: "https://dev.digitcore.cm"
            - name: NEXT_PUBLIC_WS_URL
              value: "wss://dev.api.digitcore.cm/ws"
          resources:
            limits:
              cpu: "500m"
              memory: "512Mi"
            requests:
              cpu: "250m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /api/healthz/live
              port: 3000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          readinessProbe:
            httpGet:
              path: /api/healthz/live
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
