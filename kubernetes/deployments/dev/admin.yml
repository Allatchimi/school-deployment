apiVersion: apps/v1
kind: Deployment
metadata:
  name: admin
  namespace: school-staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: admin
  template:
    metadata:
      labels:
        app: admin
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      containers:
      - name: admin
        image: "ghcr.io/emenec-finance/school/admin:3"
        ports:
        - containerPort: 3000
        envFrom:
          - secretRef:
                name: app-secret
        resources:
          limits:
            cpu: "125m"
            memory: "256Mi"
          requests:
            cpu: "125m"
            memory: "256Mi"
        livenessProbe:
          exec:
            command:
            - ls
            - /app
          initialDelaySeconds: 5
          periodSeconds: 5
