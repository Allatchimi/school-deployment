apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: school-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      imagePullSecrets:
      - name: ghcr-secret
      volumes:
      - name: postgres-prod
        persistentVolumeClaim:
          claimName: postgres-prod
      containers:
      - name: postgres
        image: "ghcr.io/emenec-finance/school/postgres:3"
        ports:
        - containerPort: 5432
        envFrom:
          - secretRef:
              name: app-secret
        volumeMounts:
        - name: postgres-prod
          mountPath: /var/lib/postgresql/data
        resources:
          limits:
            cpu: "2000m"
            memory: "4096Mi"
          requests:
            cpu: "1000m"
            memory: "2048Mi"
        livenessProbe:
          exec:
            command:
            - ls
            - /var/lib/postgresql/data
          initialDelaySeconds: 5
          periodSeconds: 5
