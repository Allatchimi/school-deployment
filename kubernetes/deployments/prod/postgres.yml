apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: school-prod
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      securityContext:
        runAsUser: 999 # Standard UID of Postgres
        fsGroup: 999 # Applies to the mounted volume
      volumes:
        - name: postgres-data-volume
          persistentVolumeClaim:
            claimName: postgres
      containers:
        - name: postgres
          image: "postgres:17-alpine"
          ports:
            - containerPort: 5432
          envFrom:
            - configMapRef:
                name: postgres-env-config
          volumeMounts:
            - name: postgres-data-volume
              mountPath: /var/lib/postgresql/data
          resources:
            limits:
              cpu: "3000m"
              memory: "8192Mi"
            requests:
              cpu: "2000m"
              memory: "4096Mi"
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 10
