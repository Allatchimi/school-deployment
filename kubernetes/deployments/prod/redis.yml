apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: school-prod
spec:
  replicas: 2
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      volumes:
        - name: redis-data-volume
          persistentVolumeClaim:
            claimName: redis
      containers:
        - name: redis
          image: "redis:7-alpine"
          ports:
            - containerPort: 6379
          envFrom:
            - configMapRef:
                name: redis-env-config
          volumeMounts:
            - name: redis-data-volume
              mountPath: /data
          resources:
            limits:
              cpu: "2"
              memory: "4Gi"
            requests:
              cpu: "1"
              memory: "2Gi"
          livenessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 6379
            initialDelaySeconds: 20
            periodSeconds: 10
