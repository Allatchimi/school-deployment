apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-school
  namespace: school-dev
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - host: dev.api.school.emfi.cm
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: api
            port:
              number: 3100

  - host: dev.admin.school.emfi.cm
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: admin
            port:
              number: 3000

  - host: dev.cdn.school.emfi.cm
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: cdn
            port:
              number: 4100
  tls:
  - hosts:
    - dev.api.school.emfi.cm
    secretName: api-tls-secret
  - hosts:
    - dev.admin.school.emfi.cm
    secretName: admin-tls-secret
  - hosts:
    - dev.cdn.school.emfi.cm
    secretName: cdn-tls-secret
