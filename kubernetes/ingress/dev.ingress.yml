apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress-school
  namespace: school-dev
  annotations:
    ingressClassName: traefik
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
    traefik.ingress.kubernetes.io/router.middlewares: sslredirect@kubernetescrd
    cert-manager.io/cluster-issuer: "letsencrypt-fake"
spec:
  rules:
    - host: dev.api.digitcore.cm
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3100
    - host: dev.digitcore.cm
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: admin
                port:
                  number: 3000
  tls:
    - hosts:
        - dev.api.digitcore.cm
      secretName: api-tls-secret
    - hosts:
        - dev.digitcore.cm
      secretName: admin-tls-secret
