apiVersion: v1
kind: PersistentVolume
metadata:
  name: cdn-prod
  namespace: school-prod
spec:
  storageClassName: standard
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  accessModes:
    - ReadWriteMany
  capacity:
      storage: 200Gi
  local:
    path: /mnt/cdn
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - vmi2139037.contaboserver.net # Cluster/node name

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cdn-prod
  namespace: school-prod
spec:
  volumeName: cdn-prod
  storageClassName: standard
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 200Gi
