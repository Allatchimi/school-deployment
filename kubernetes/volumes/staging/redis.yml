apiVersion: v1
kind: PersistentVolume
metadata:
  name: redis-staging
  namespace: school-staging
spec:
  storageClassName: standard
  volumeMode: Filesystem
  persistentVolumeReclaimPolicy: Retain
  accessModes:
    - ReadWriteMany
  capacity:
      storage: 1Gi
  local:
    path: /mnt/redis
  nodeAffinity:
    required:
      nodeSelectorTerms:
      - matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - emfi # Cluster/node name

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: redis-staging
  namespace: school-staging
spec:
  volumeName: redis-staging
  storageClassName: standard
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 512Mi
